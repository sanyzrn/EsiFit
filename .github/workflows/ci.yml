name: EsiFit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# This checks source only. Deployments remain owned by Vercel.
permissions:
  contents: read

concurrency:
  group: esifit-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build & essential tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Entirely disposable local Postgres. Never connect tests to Supabase.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: esifit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d esifit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/esifit_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/esifit_test
      SESSION_SECRET: ci-only-dummy-secret-do-not-use-in-production-0123456789
      SMS_PROVIDER: dev
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Essential tests (unit, authentication, roles)
        run: npx vitest run tests/unit tests/api/auth.test.ts tests/api/roles.test.ts tests/api/community.test.ts tests/api/ai.test.ts tests/api/validated-audit.test.ts tests/api/pwa-engagement-audit.test.ts tests/api/commerce-privacy-audit.test.ts

      - name: Production build and type check
        run: npm run build
