# Quality gate. Deploy runs only after this succeeds on main
# (same shape as DbsWebsite_2: CI → workflow_run → deploy).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # The schema targets MySQL, so the API tests need a real engine —
      # SQLite would not catch column-type or collation problems.
      mysql:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: esifit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/esifit_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - run: bunx tsc --noEmit

      - run: bun run lint

      - run: bun run test

      - name: Production build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Artifact must not contain local secrets or a database
        run: |
          set -euo pipefail
          if [ -e .next/standalone/.env ]; then
            echo "ERROR: .env leaked into the standalone artifact"; exit 1
          fi
          if compgen -G ".next/standalone/prisma/db/*" > /dev/null; then
            echo "ERROR: a database file leaked into the standalone artifact"; exit 1
          fi
          test -f .next/standalone/server.js
          test -d .next/standalone/.next/static
          echo "artifact OK"
